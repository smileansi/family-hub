<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>시안 03 · Playful Tiles</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="playful">
  <header class="pf-head"><a href="index.html"><b>FAM!</b></a><nav><span class="active">홈</span><span>일정</span><span>목록</span><span>메모</span></nav><button>＋ 추가하기</button></header>
  <main>
    <section class="pf-title"><div><small>7월 25일 토요일</small><h1>우리 가족,<br>오늘도 <i>화이팅!</i></h1></div><div class="faces"><span>👨🏻</span><span>👩🏻</span><span>👦🏻</span><span>👧🏻</span></div></section>
    <section class="tiles">
      <article class="tile cobalt wide"><div class="tile-top"><span>오늘 일정</span><b>3</b></div><h2>오후 2시,<br>가족 장보기</h2><p>그 전에 도경이 플라톤 수업이 있어요.</p><button>일정 전체보기 ↗</button><div class="orbit">2:00</div></article>
      <article class="tile yellow"><div class="tile-top"><span>날씨</span><b>☀</b></div><strong class="big">27°</strong><p>구름 조금<br>최고 31°</p></article>
      <article class="tile white"><div class="tile-top"><span>할 일</span><b>2/4</b></div><ul><li class="done">숙소 확인</li><li>준비물 챙기기</li><li>공과금 납부</li></ul><button class="round">＋</button></article>
      <article class="tile coral"><div class="tile-top"><span>장보기</span><b>4</b></div><h2>계란, 우유,<br>고추장 외 1개</h2><p>예상 금액 24,000원</p><div class="bag">▱</div></article>
      <article class="tile mint wide memo"><div><div class="tile-top"><span>최근 메모</span><b>→</b></div><h2>집 와이파이<br>비밀번호</h2></div><div class="note">다산 화장실<br><small>어제 수정</small></div></article>
    </section>
  </main>
  <nav class="pf-mobile"><span>⌂<small>홈</small></span><span>▦<small>일정</small></span><span class="plus">＋</span><span>✓<small>할 일</small></span><span>□<small>메모</small></span></nav>
</body>
</html>
